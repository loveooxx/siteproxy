[package]
name = "siteproxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
# UPGRADED: reqwest 0.12 uses http 1.0, matching axum 0.7
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "brotli", "deflate", "stream"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "compression-full", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8.2"
regex = "1.10"
lazy_static = "1.4"
encoding_rs = "0.8"
mime = "0.3"
url = "2.5"
anyhow = "1.0"
bytes = "1.5"
futures = "0.3"
# ADDED: Missing dependencies
chrono = "0.4"
mime_guess = "2.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
